[tools]
node = "24.18.1"
pnpm = "11.20.0"
# Select the pinned binary before rustup adds Cargo's shared bin directory.
"cargo:worker-build" = "0.9.0"
rust = { version = "1.97.1", targets = "wasm32-unknown-unknown" }

[tasks]
dev = "pnpm dev"
"dev:admin" = "pnpm dev --mode admin"
build = "pnpm build"
"wrangler:local" = "pnpm exec wrangler --config api/wrangler.jsonc --local --persist-to .wrangler/state"

[tasks.setup]
run = [
  "pnpm install --frozen-lockfile",
  "test -f api/.dev.vars || cp api/.dev.vars.example api/.dev.vars",
  "mise run wrangler:local d1 migrations apply DB",
]

[tasks.test]
dir = "api"
run = ["pnpm --dir ../web run build", "node --test tests/*.test.mjs"]

[tasks.deploy]
description = "Migrate production D1 and deploy the API and Web Workers"
run = [
  "pnpm exec wrangler d1 migrations apply DB --cwd api --remote --force",
  "pnpm exec wrangler deploy --cwd api",
  "pnpm --dir web run build",
  "pnpm --dir web exec wrangler deploy",
]
