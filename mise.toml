[tools]
node = "24.18.1"
pnpm = "11.20.0"
# Select the pinned binary before rustup adds Cargo's shared bin directory.
"cargo:worker-build" = "0.9.0"
rust = { version = "1.97.1", targets = "wasm32-unknown-unknown" }

[tasks]
dev = "pnpm dev"
build = "pnpm build"

[tasks.setup]
run = [
  "pnpm install --frozen-lockfile",
  "test -f .dev.vars || cp .dev.vars.example .dev.vars",
  "pnpm exec wrangler d1 migrations apply DB --local",
]
