[package]
name = "wavlark-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rusty-s3 = { version = "0.12", default-features = false, features = ["rustcrypto", "wasm_bindgen"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
worker = { version = "0.9", features = ["d1"] }
